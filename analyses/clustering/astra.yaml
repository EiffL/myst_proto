spec_version: 0.1.0
label: Clustering
description: Pre- and post-reconstruction two-point correlation-function measurements for the eight DESI DR1
  tracer-redshift bins, plus a multipole summary figure.
analyses:
  parent:
    path: ../..
outputs:
  xi_pre_recon_bgs:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for BGS (z=0.1-0.4). Monopole-only fit.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer bgs --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_bgs:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for BGS (RecSym). BGS parent recon spans 0.1 <= z <= 0.4 (no
      sub-binning).
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer bgs --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_bgs_full
  xi_pre_recon_lrg1:
    type: data
    format: npy
    description: "Pre-recon xi(s, mu) for LRG1. pycorr TwoPointCorrelationFunction (.npy),\nGCcomb, s in [0, 200]
      Mpc/h at 4 Mpc/h bins, mu in [-1, 1] at 200 bins.\n"
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_lrg1:
    type: data
    format: npy
    description: "Post-recon xi(s, mu) for LRG1 (RecSym). Slices the LRG parent post-recon\ncatalog to 0.4 <= z
      <= 0.6.\n"
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_lrg_full
  xi_pre_recon_lrg2:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for LRG2. Same format as xi_pre_recon_lrg1.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg2 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_lrg2:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for LRG2 (RecSym). Slices LRG parent NPZ to 0.6 <= z <= 0.8.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg2 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_lrg_full
  xi_pre_recon_lrg3:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for LRG3 (z=0.8-1.1). Same format as xi_pre_recon_lrg1.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg3 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_lrg3:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for LRG3 (RecSym). Slices LRG parent NPZ to 0.8 <= z <= 1.1.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg3 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_lrg_full
  xi_pre_recon_elg1:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for ELG1 (z=0.8-1.1). Monopole-only fit.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer elg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_elg1:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for ELG1 (RecSym). Slices ELG parent NPZ to 0.8 <= z <= 1.1.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer elg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_elg_full
  xi_pre_recon_elg2:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for ELG2 (z=1.1-1.6). Same format as xi_pre_recon_lrg1.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer elg2 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_elg2:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for ELG2 (RecSym). Slices ELG parent NPZ to 1.1 <= z <= 1.6.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer elg2 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_elg_full
  xi_pre_recon_lrg3_elg1:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for the LRG3+ELG1 combined tracer (0.8 < z < 1.1).
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg3_elg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 4h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_lrg3_elg1:
    type: data
    format: npy
    description: Post-recon xi(s, mu) for the LRG3+ELG1 combined tracer (RecSym).
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer lrg3_elg1 --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 4h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_lrg_full
    - parent.reconstruction.post_recon_catalog_elg_full
  xi_pre_recon_qso:
    type: data
    format: npy
    description: Pre-recon xi(s, mu) for QSO (z=0.8-2.1). Monopole-only fit.
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer qso --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.desi_dr1_lss_catalogs
  xi_post_recon_qso:
    type: data
    format: npy
    description: "Post-recon xi(s, mu) for QSO (RecSym, sm30). QSO parent recon spans\n0.8 <= z <= 2.1 (no sub-binning)
      with Sigma_sm = 30 h^-1 Mpc — matches\nthe sm30 RascalC cov.\n"
    decisions:
    - imaging_weights
    recipe:
      command: python -u scripts/compute_xi.py --output {output} --tracer qso --imaging_weights
        {decisions.imaging_weights}
      resources:
        cpus: 32
        memory: 128GB
        time_limit: 2h
    inputs:
    - parent.desi_fiducial_cosmology
    - parent.reconstruction.post_recon_catalog_qso_full
  xi_multipoles_plot:
    type: figure
    format: png
    description: "Pre- and post-recon xi_ell(s) multipoles (ell = 0, 2, 4) plotted as\ns^2 * xi(s), one row per
      tracer so the BAO feature at s ~ 100 Mpc/h\nis visible. Post-recon monopole should show a sharper BAO peak.\n"
    inputs:
    - xi_pre_recon_bgs
    - xi_post_recon_bgs
    - xi_pre_recon_lrg1
    - xi_post_recon_lrg1
    - xi_pre_recon_lrg2
    - xi_post_recon_lrg2
    - xi_pre_recon_lrg3
    - xi_post_recon_lrg3
    - xi_pre_recon_elg1
    - xi_post_recon_elg1
    - xi_pre_recon_elg2
    - xi_post_recon_elg2
    - xi_pre_recon_lrg3_elg1
    - xi_post_recon_lrg3_elg1
    - xi_pre_recon_qso
    - xi_post_recon_qso
    recipe:
      command: python -u scripts/plot_xi.py --output {output}
decisions:
  imaging_weights:
    label: Imaging-systematics weights
    tags:
    - clustering
    - systematics
    rationale: "BAO is insensitive to the imaging-systematics correction (largest\nshift 0.27 sigma across tracers).
      This decision exposes that null\ntest. `on` uses the full DESI `WEIGHT` column\n(WEIGHT_COMP * WEIGHT_SYS
      * WEIGHT_ZFAIL). `off` drops the WEIGHT_SYS\nfactor, keeping only completeness + redshift-failure corrections.\n"
    options:
      on:
        label: On (default)
        description: Full WEIGHT * WEIGHT_FKP, matches DESI fiducial clustering.
      off:
        label: Off (no imaging correction)
        description: WEIGHT_COMP * WEIGHT_ZFAIL * WEIGHT_FKP -- 'No weight' null test.
